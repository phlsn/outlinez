[project]
name = "outlinez"
version = "1.0.7"
description = "Lokales Freistellen von Bildern mit BiRefNet"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7",
    "torchvision>=0.22",
    "transformers>=4.45,<5",
    "timm",
    "kornia",
    "einops",
    "pillow",
    "numpy",
    "opencv-python-headless",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "psd-tools>=1.26.0",
    "pywebview>=6.2.1",
    "watchdog>=7.0.0",
]

[tool.uv]
package = false
# Installer gibt es für Windows und macOS; der Lockfile deckt genau diese ab
environments = ["sys_platform == 'win32'", "sys_platform == 'darwin'"]

[tool.uv.sources]
# Windows: PyTorch mit CUDA (läuft ohne NVIDIA-Karte auf dem Prozessor), macOS: Standardpaket mit MPS
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
